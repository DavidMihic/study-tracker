; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:feather]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_feather
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
upload_protocol = mbed
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/RTClib
    olikraus/U8g2_for_Adafruit_GFX
build_flags = -Isrc
; The 8 MB flash chip: 1 MB for the LittleFS file system (settings + session log), the rest is program.
board_build.filesystem = littlefs
board_build.filesystem_size = 1m

; DEMO build with made-up study data in the session log (src/debug/dummy_data.h), to look at the
; statistics screen: pio run -e feather_demo -t upload. Delete this section when the device is finished.
[env:feather_demo]
extends = env:feather
build_flags = ${env:feather.build_flags} -DDUMMY_DATA

; Encoder-only bring-up: pio run -e encoder_test -t upload
[env:encoder_test]
extends = env:feather
build_src_filter = -<*> +<../bringup/encoder_test.cpp>


; Encoder decoder test: pio run -e encoder_decoder -t upload
[env:encoder_decoder]
extends = env:feather
build_src_filter = -<*> +<../bringup/encoder_decoder_test.cpp>


; Push switch test: pio run -e button_test -t upload
[env:button_test]
extends = env:feather
build_src_filter = -<*> +<../bringup/button_test.cpp>


; Display test: pio run -e display_test -t upload
[env:display_test]
extends = env:feather
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
build_src_filter = -<*> +<../bringup/display_test.cpp>


; Buzzer test: pio run -e buzzer_test -t upload
[env:buzzer_test]
extends = env:feather
build_src_filter = -<*> +<../bringup/buzzer_test.cpp>


; RTC test: pio run -e rtc_test -t upload
[env:rtc_test]
extends = env:feather
build_src_filter = -<*> +<../bringup/rtc_test.cpp>


; Logic tests that run on the PC (no board needed):  pio test -e native
; Only files without Arduino code are built; the test list of subjects replaces data/subjects.cpp.
[env:native]
platform = native
build_flags = -Isrc -std=gnu++17
test_build_src = yes
build_src_filter =
    -<*>
    +<data/progress.cpp>
    +<app/semester.cpp>
    +<app/subject_list.cpp>
    +<app/session.cpp>
    +<app/date_edit.cpp>
    +<app/app_state.cpp>
    +<app/persistence.cpp>
    +<data/save_format.cpp>
    +<data/session_log.cpp>
    +<app/stats.cpp>
    +<ui/format.cpp>
    +<ui/ecg.cpp>
    +<../test/support/test_subjects.cpp>
; test_curriculum checks the REAL subject list and has its own environment below.
test_ignore = test_curriculum

; Tests on the real curriculum (src/data/subjects.cpp) and the full-size save data: pio test -e native_curriculum
[env:native_curriculum]
extends = env:native
test_ignore =
test_filter = test_curriculum
build_src_filter =
    ${env:native.build_src_filter}
    -<../test/support/test_subjects.cpp>
    +<data/subjects.cpp>
