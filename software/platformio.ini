; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:feather]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_feather
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
upload_protocol = mbed
lib_deps =
    adafruit/Adafruit PCD8544 Nokia 5110 LCD library
    adafruit/Adafruit GFX Library
    adafruit/RTClib

; Encoder-only bring-up: pio run -e encoder_test -t upload
[env:encoder_test]
extends = env:feather
build_src_filter = -<*> +<../bringup/encoder_test.cpp>


; Encoder decoder test: pio run -e encoder_decoder -t upload
[env:encoder_decoder]
extends = env:feather
build_src_filter = -<*> +<../bringup/encoder_decoder_test.cpp>


; Push switch test: pio run -e button_test -t upload
[env:button_test]
extends = env:feather
build_src_filter = -<*> +<../bringup/button_test.cpp>


; Display test: pio run -e display_test -t upload
[env:display_test]
extends = env:feather
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
build_src_filter = -<*> +<../bringup/display_test.cpp>


; Buzzer test: pio run -e buzzer_test -t upload
[env:buzzer_test]
extends = env:feather
build_src_filter = -<*> +<../bringup/buzzer_test.cpp>


; RTC test: pio run -e rtc_test -t upload
[env:rtc_test]
extends = env:feather
build_src_filter = -<*> +<../bringup/rtc_test.cpp>
